name: Build Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            artifact: desktop-macos
            files: |
              release/*.dmg
              release/*.zip
          - os: windows-latest
            script: dist:win
            artifact: desktop-windows
            files: release/*.exe
          - os: ubuntu-latest
            script: dist:linux
            artifact: desktop-linux
            files: |
              release/*.AppImage
              release/*.deb
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run test
      - if: matrix.os == 'macos-latest'
        run: npm run test:e2e
      - run: npm run ${{ matrix.script }}
        env:
          GH_TOKEN: ''
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
