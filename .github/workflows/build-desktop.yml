name: Build Desktop

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            artifact: desktop-macos
            files: |
              release/*.dmg
              release/*.dmg.blockmap
              release/*.zip
              release/*.zip.blockmap
              release/latest-mac.yml
          - os: windows-latest
            script: dist:win
            artifact: desktop-windows
            files: |
              release/*.exe
              release/*.exe.blockmap
              release/latest.yml
          - os: ubuntu-latest
            script: dist:linux
            artifact: desktop-linux
            files: |
              release/*.AppImage
              release/*.deb
              release/latest-linux.yml
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test
      - if: matrix.os == 'macos-latest'
        run: npm run test:e2e
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: true

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Download all platform installers
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: dist-artifacts
          merge-multiple: true

      - name: Verify release tag
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          EXPECTED_TAG="v${VERSION}"
          case "$RELEASE_TAG" in
            "$EXPECTED_TAG"|"$EXPECTED_TAG"-*) ;;
            *)
              echo "::error::Release tag ${RELEASE_TAG} does not match package version ${EXPECTED_TAG}"
              exit 1
              ;;
          esac
          if [[ "$RELEASE_TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Normalize release asset names
        working-directory: dist-artifacts
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f -name '* *' -print0 | while IFS= read -r -d '' file; do
            mv -- "$file" "${file// /-}"
          done
          find . -maxdepth 1 -type f -print | sed 's#^./##' | sort

      - name: Generate SHA-256 checksums
        working-directory: dist-artifacts
        run: |
          set -euo pipefail
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish installers to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; updating assets."
            gh release upload "$RELEASE_TAG" dist-artifacts/* --clobber
            if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" == "true" ]]; then
              gh release edit "$RELEASE_TAG" --draft=false
            fi
          else
            args=(--verify-tag --title "Ideogram4 Editor ${RELEASE_TAG}" --generate-notes)
            if [[ "$PRERELEASE" == "true" ]]; then
              args+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" dist-artifacts/* "${args[@]}"
          fi
          {
            echo "### ${RELEASE_TAG}"
            echo
            echo "Published macOS, Windows and Linux installers with SHA-256 checksums."
          } >> "$GITHUB_STEP_SUMMARY"
